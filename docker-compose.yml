services:
  db:
    image: postgres:16
    container_name: billing-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: billing
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d billing"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    image: electricity-backend:1.0
    container_name: billing-backend
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: admin123
      DB_NAME: billing
      JWT_SECRET: change_this_secret
      FIXED_CHARGE: 50
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: electricity-frontend:1.0
    container_name: billing-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
